name: FITZONE Integration

on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main     

jobs: 
    build:
        runs-on: [ubuntu-latest]
        steps:
            - name: checkout code          
              uses: actions/checkout@v6

            - name: setup go app 
              uses: actions/setup-go@v6
              with:
                go-version: 1.23
                cache: true

            - name: setup mongodb
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                mongodb-version: 8.0.0    
             
            - name: download dependencies
              run: go mod download

            - name: go test 
              run: go test ./...
              env: 
                MONGODB_URI: mongodb://mongodb:27017
                MONGODB_DATABASE: fitzone
                JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-random-value-at-least-32-chars}  
         
            
            - name: build go app
              run: go build -v ./...



    docker-test:
        runs-on: [ubuntu-latest]

        needs: build      

        steps: 
            - name: checkout code
              uses: actions/checkout@v6

            - name: docker compse version
              run: docker compose version


            - name: build  and run containers
              run: |
                docker compose -f docker-compose.yml up -d --build

            - name: Test containers
              run: |
                docker compose -f docker-compose.yml exec -T app go test ./...
                
            - name: test API endpoint
              run: |
                docker compose -f docker-compose.yml exec -T app curl -s http://localhost:4000/health | grep "OK"
                
            - name: stop ane remove containers
              run: |
                docker compose -f docker-compose.yml down -v    


