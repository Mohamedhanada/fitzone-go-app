apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: fitzone
  labels: 
    app: fitzone
spec:                       #دي بتعبر عن حالة البود
 replicas: 1
 selector: 
  matchLabels:
    app: fitzone
 template:
  metadata:
    labels: 
      app: fitzone
  spec:                                   #دي بتعبر عن حالة الكونتينر
    containers:
    - name: fitzone-app
      image:  moha983/fitzone-app:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 4000
        
      env:
        - name: Mongodb_URI
          value: mongodb://mongodb-service:27017
        - name: server_port
          value: "4000"

    - name: mongodb
      image: mongo:8
      ports:
        - containerPort: 27017
